<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Support - FreeYTDownloader</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.7; color: #334155; background: #f8fafc; margin: 0; padding: 40px 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 12px; border: 1px solid #e2e8f0; }
    h1 { color: #0f172a; margin-bottom: 8px; font-size: 24px; }
    p.sub { color: #64748b; font-size: 14px; margin-bottom: 25px; }
    a { color: #e62117; text-decoration: none; }
    .back { display: inline-block; margin-bottom: 20px; font-weight: 600; font-size: 13.5px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13.5px; font-weight: 600; color: #1e293b; margin-bottom: 6px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
    input:focus, textarea:focus { border-color: #e62117; box-shadow: 0 0 0 3px rgba(230, 33, 23, 0.15); }
    button { background: #e62117; color: #fff; border: none; padding: 12px 24px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; }
    button:hover { background: #cc181e; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back">&larr; Back to FreeYTDownloader</a>
    <h1>Contact Support</h1>
    <p class="sub">Have a question or report? Send a message directly to our team.</p>

    <form action="https://formsubmit.co/luckypirate11@gmail.com" method="POST">
      <input type="text" name="_honey" style="display:none">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_subject" value="Support Message - FreeYTDownloader">
      <input type="hidden" name="_next" value="https://freeytdownloader.cyou/contact.html?sent=1">

      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required placeholder="Alex">
      </div>
      <div class="form-group">
        <label for="email">Your Email Address</label>
        <input type="email" id="email" name="email" required placeholder="alex@example.com">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required placeholder="How can we help?"></textarea>
      </div>
      <button type="submit">Send Message</button>
    </form>
  </div>
</body>
</html>
